server:
  port: 8080

spring:
  application:
    name: core-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_recsys
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # update: tự tạo/bổ sung bảng nếu thiếu. Khi lên production nên đổi thành validate.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  search:
    limit: 10
