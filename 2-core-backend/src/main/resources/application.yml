server:
  port: 8080

spring:
  application:
    name: core-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/recsys
    username: postgres
    password: "123456"
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

app:
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"
  model:
    url: "http://localhost:8000"
    timeout-seconds: 30
  search:
    page-size: 20
    session-ttl-minutes: 30
  images:
    base-dir: "/home/ds300/Demo-Web/data/image"
